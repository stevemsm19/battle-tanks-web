<div class="sidebar">
  <div class="sidebar-top">
    <h1 class="game-title">Battle Tank</h1>

    <div class="menu-buttons">
      <app-button
        label="Play"
        variant="secondary"
        [fullWidth]="true"
        [isActive]="activeMenu === 'play'"
        (clicked)="navigate('/play')"
      ></app-button>
      <app-button
        label="My Account"
        variant="secondary"
        [fullWidth]="true"
        [isActive]="activeMenu === 'account'"
        (clicked)="navigate('/my-account')"
      ></app-button>
      <app-button
        label="Controls"
        variant="secondary"
        [fullWidth]="true"
        [isActive]="activeMenu === 'controls'"
        (clicked)="navigate('/controls')"
      ></app-button>
      <app-button
        label="Leaderboard"
        variant="secondary"
        [fullWidth]="true"
        [isActive]="activeMenu === 'leaderboard'"
        (clicked)="navigate('/leaderboard')"
      ></app-button>
    </div>
  </div>

  <app-button
    label="Log Out"
    variant="secondary"
    [fullWidth]="true"
    (clicked)="logout()"
  ></app-button>
</div>
