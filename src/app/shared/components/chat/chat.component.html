<div class="chat-header">
  <h2 class="section-title"><i class="icon-chat"></i> ROOM CHAT</h2>
  <span class="channel-info">CHANNEL: GLOBAL</span>
</div>

<div class="chat-history">
  @for (msg of messages; track $index) {
    <div
      class="chat-message"
      [class.mine]="msg.senderId === currentUserId"
      [class.other]="msg.senderId !== currentUserId"
    >
      <div class="message-header">
        <span class="sender">{{ msg.sender }}</span>
        <span class="time">{{ msg.time }}</span>
      </div>
      <div class="message-body">
        {{ msg.text }}
      </div>
    </div>
  }
</div>

<div class="chat-input-area">
  <input
    type="text"
    [(ngModel)]="newMessage"
    (keyup.enter)="sendMessage()"
    placeholder="TYPE MESSAGE..."
    class="chat-input"
  />
  <button (click)="sendMessage()" class="send-btn">></button>
</div>
