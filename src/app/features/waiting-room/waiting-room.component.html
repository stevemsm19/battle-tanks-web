<div class="waiting-room-container">
  <header class="room-header">
    <h1 class="title">WAITING ROOM</h1>
    <p class="subtitle">GAME: {{ roomName() }} - {{ mapName() }}</p>
  </header>

  <div class="main-content">
    <section class="players-section">
      <h2 class="section-title"><i class="icon-users"></i> PLAYERS</h2>

      <div class="players-list">
        @for (player of players(); track player.id) {
          <div class="player-card" [class.owner]="player.isOwner">
            <div class="player-info">
              <div class="avatar-placeholder">
                <span class="user-icon">👤</span>
              </div>
              <div class="name-container">
                <span class="player-name">{{ player.name }}</span>
                @if (player.isOwner) {
                  <span class="creator-badge">OWNER</span>
                }
              </div>
            </div>
            <div class="player-status">
              @if (player.isOwner) {
                <span class="status-icon star">★</span>
              }
            </div>
          </div>
        }
      </div>
      <div class="invite-btn">
        <app-button
          label="INVITE FRIENDS"
          variant="secondary"
          [fullWidth]="true"
          [fullHeight]="true"
          (clicked)="isInviteModalOpen.set(true)"
        ></app-button>
      </div>
    </section>

    <app-chat [roomId]="roomId()"></app-chat>
  </div>
  <footer class="action-bar">
    <app-button
      label="LEAVE"
      variant="danger"
      [disabled]="isLeaving()"
      (clicked)="leaveRoom()"
    ></app-button>
    <app-button
      label="START GAME"
      variant="primary"
      (clicked)="startGame()"
    ></app-button>
  </footer>
</div>

@if (isLeaveModalOpen()) {
  <app-toast
    message="Are you sure you want to leave the room?"
    (confirm)="confirmLeave()"
    (cancel)="isLeaveModalOpen.set(false)"
  ></app-toast>
}

@if (isInviteModalOpen()) {
  <app-toast
    [message]="inviteMessage"
    [infoMessage]="copyFeedback()"
    confirmLabel="Copy Code"
    cancelLabel="Close"
    (confirm)="copyRoomCode()"
    (cancel)="isInviteModalOpen.set(false)"
  ></app-toast>
}
