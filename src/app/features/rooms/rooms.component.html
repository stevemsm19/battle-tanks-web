<div class="rooms-container">
  <div class="header">
    <h2>Salas Disponibles</h2>
    <button class="create-btn" (click)="openModal()">Crear Sala</button>
  </div>

  @if (isModalOpen) {
    <div class="modal-overlay" (click)="closeModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <h3>Crear Sala</h3>

        <div class="form-group">
          <label for="roomName">Nombre de la Sala</label>
          <input
            type="text"
            id="roomName"
            [(ngModel)]="newRoom.name"
            placeholder="Ej. Sala 1"
          />
        </div>

        <div class="form-group">
          <label for="maxPlayers">Jugadores Máximos</label>
          <input
            type="number"
            id="maxPlayers"
            [value]="newRoom.maxPlayers"
            readonly
          />
        </div>

        <div class="modal-actions">
          <button class="cancel-btn" (click)="closeModal()">Cancelar</button>
          <button
            class="confirm-btn"
            (click)="createRoom()"
            [disabled]="!newRoom.name"
          >
            Crear
          </button>
        </div>
      </div>
    </div>
  }

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Jugadores</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        @for (room of rooms; track room.id) {
          <tr>
            <td>{{ room.name }}</td>
            <td>{{ room.currentPlayers }}/{{ room.maxPlayers }}</td>
            <td>
              <span class="status" [class.open]="room.status === 'Open'">
                {{ statusMap[room.status] }}
              </span>
            </td>
            <td>
              <button class="join-btn" (click)="joinRoom(room.id)">
                Unirse
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="no-rooms">No hay salas disponibles</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
