<div
  class="tank-unit"
  [style.left]="'calc(' + ((x || 1) - 1) + ' * (100% / 24))'"
  [style.top]="'calc(' + ((y || 1) - 1) + ' * (100% / 16))'"
>
  <div class="tank-body {{ healthClass }}">
    <div class="tank-turret {{ directionClass }}"></div>
  </div>
  <div class="tank-name">{{ name }}</div>
</div>
