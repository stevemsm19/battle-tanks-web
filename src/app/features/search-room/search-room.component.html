<div class="rooms-container">
  <header class="top-container">
    <app-button
      label="Back"
      variant="secondary"
      (clicked)="goBack()"
    ></app-button>
    <div class="top-bar-title">Search Room</div>
    <div>
      <app-button
        label="Create Room"
        variant="primary"
        (clicked)="openModal()"
      ></app-button>
    </div>
  </header>

  @if (isModalOpen) {
    <div class="modal-overlay" (click)="closeModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <h3>Create Room</h3>

        <div class="form-group">
          <label for="roomName">Room Name</label>
          <input
            type="text"
            id="roomName"
            [(ngModel)]="newRoom.name"
            placeholder="e.g. Room 1"
            [disabled]="isCreating"
          />
        </div>

        <div class="form-group">
          <label for="maxPlayers">Max Players</label>
          <input
            type="number"
            id="maxPlayers"
            [value]="newRoom.maxPlayers"
            readonly
            [disabled]="isCreating"
          />
        </div>

        <div class="modal-actions">
          <button
            class="cancel-btn"
            (click)="closeModal()"
            [disabled]="isCreating"
          >
            Cancel
          </button>
          <button
            class="confirm-btn"
            (click)="createRoom()"
            [disabled]="!newRoom.name || isCreating"
          >
            {{ isCreating ? "Creating..." : "Create" }}
          </button>
        </div>
      </div>
    </div>
  }
  <div class="body-content">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Players</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          @for (room of rooms; track room.id) {
            <tr>
              <td>{{ room.name }}</td>
              <td>{{ room.currentPlayers }}/{{ room.maxPlayers }}</td>
              <td>
                <span class="status" [class.open]="room.status === 'Open'">
                  {{ statusMap[room.status] }}
                </span>
              </td>
              <td>
                <app-button
                  label="Join"
                  variant="primary"
                  (clicked)="joinRoom(room.id)"
                ></app-button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="no-rooms">No rooms available</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
