<div class="rooms-container">
  <header class="top-container">
    <app-button
      label="Back"
      variant="secondary"
      (clicked)="goBack()"
    ></app-button>
    <app-page-title title="Search Room"></app-page-title>
  </header>

  <div class="body-content">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Players</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          @for (room of rooms(); track room.id) {
            <tr>
              <td>{{ room.name }}</td>
              <td>{{ room.currentPlayers }}/{{ room.maxPlayers }}</td>
              <td>
                <span class="status" [class.open]="room.status === 'Open'">
                  {{ statusMap[room.status] }}
                </span>
              </td>
              <td>
                <app-button
                  label="Join"
                  variant="primary"
                  (clicked)="joinRoom(room.id)"
                ></app-button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="no-rooms">No rooms available</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

@if (isRedirectModalOpen()) {
  <app-toast
    message="You already belong to an active room. If you want to join another one, please leave your current room first.<br><br>Do you want to go to your current room?"
    (cancel)="closeRedirectModal()"
    (confirm)="redirectToActiveRoom()"
  >
  </app-toast>
}
