<div class="page-container">
  <header class="top-container">
    <app-page-title title="Play"></app-page-title>
  </header>

  <div class="body-container">
    <app-sidebar activeMenu="play"></app-sidebar>

    <div class="content-panel">
      <div class="row-full">
        <div class="image-placeholder">
          <img src="/assets/images/image.png" alt="Tank" />
        </div>
        <app-button
          label="Search Room"
          variant="primary"
          [fullWidth]="true"
          (clicked)="navigate('/search-room')"
        ></app-button>
      </div>

      <div class="row-split">
        <div class="card">
          <div class="image-placeholder">
            <img src="/assets/images/image.png" alt="Tank" />
          </div>
          <app-button
            label="Create Room"
            variant="primary"
            [fullWidth]="true"
            (clicked)="isCreateModalOpen.set(true)"
          ></app-button>
        </div>
        <div class="card">
          <div class="image-placeholder">
            <img src="/assets/images/image.png" alt="Tank" />
          </div>
          <app-button
            label="Enter by ID"
            variant="primary"
            [fullWidth]="true"
            (clicked)="isJoinModalOpen.set(true)"
          ></app-button>
        </div>
      </div>
    </div>
  </div>
</div>

@if (isCreateModalOpen()) {
  <app-create-room-modal
    (closed)="isCreateModalOpen.set(false)"
    (redirectNeeded)="onRedirectNeeded($event)"
  ></app-create-room-modal>
}

@if (isJoinModalOpen()) {
  <app-join-room-modal
    (closed)="isJoinModalOpen.set(false)"
    (redirectNeeded)="onRedirectNeeded($event)"
  ></app-join-room-modal>
}

@if (isRedirectModalOpen()) {
  <app-toast
    message="You already belong to an active room. If you want to join another one, please leave your current room first. Do you want to go to your current room?"
    (cancel)="closeRedirectModal()"
    (confirm)="redirectToActiveRoom()"
  >
  </app-toast>
}
