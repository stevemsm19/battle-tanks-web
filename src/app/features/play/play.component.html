<div class="page-container">
  <header class="top-container">
    <div class="top-bar-title">Play</div>
  </header>

  @if (isModalOpen) {
    <div class="modal-overlay" (click)="closeModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <h3>Create Room</h3>

        <div class="form-group">
          <label for="roomName">Room Name</label>
          <input
            type="text"
            id="roomName"
            [(ngModel)]="newRoom.name"
            placeholder="e.g. My Awesome Room"
          />
        </div>

        <div class="form-group">
          <label for="maxPlayers">Max Players</label>
          <input
            type="number"
            id="maxPlayers"
            [(ngModel)]="newRoom.maxPlayers"
            min="2"
            max="4"
          />
        </div>

        <div class="modal-actions">
          <button class="cancel-btn" (click)="closeModal()">Cancel</button>
          <button
            class="confirm-btn"
            (click)="createRoom()"
            [disabled]="
              !newRoom.name || newRoom.maxPlayers < 2 || newRoom.maxPlayers > 4
            "
          >
            Create
          </button>
        </div>
      </div>
    </div>
  }

  <div class="body-container">
    <app-sidebar activeMenu="play"></app-sidebar>

    <div class="content-panel">
      <div class="row-full">
        <div class="image-placeholder"></div>
        <app-button
          label="Search Room"
          variant="secondary"
          [fullWidth]="true"
          (clicked)="navigate('/search-room')"
        ></app-button>
      </div>

      <div class="row-split">
        <div class="card">
          <div class="image-placeholder"></div>
          <app-button
            label="Create Room"
            variant="secondary"
            [fullWidth]="true"
            (clicked)="openModal()"
          ></app-button>
        </div>
        <div class="card">
          <div class="image-placeholder"></div>
          <app-button
            label="Enter by ID"
            variant="secondary"
            [fullWidth]="true"
          ></app-button>
        </div>
      </div>
    </div>
  </div>
</div>
