<div class="modal-overlay" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h3>Create Room</h3>

    <form [formGroup]="roomForm">
      <app-input
        label="Room Name"
        type="text"
        placeholder="e.g. My Awesome Room"
        [control]="nameControl"
        [errorMessages]="{ required: 'Room name is required.' }"
      ></app-input>

      <app-input
        label="Max Players"
        type="number"
        placeholder="2–4"
        [control]="maxPlayersControl"
        [errorMessages]="{
          required: 'Required.',
          min: 'Min 2.',
          max: 'Max 4.',
        }"
      ></app-input>

      <div class="form-group select-map-group">
        <label for="mapSelect">Select Map</label>
        <select id="mapSelect" formControlName="gameMapId">
          <option value="" disabled selected>-- Choose a Map --</option>
          @for (map of availableMaps(); track map.id) {
            <option [value]="map.id">{{ map.name }}</option>
          }
        </select>
      </div>

      <div class="modal-actions">
        <app-button
          label="Cancel"
          variant="secondary"
          (clicked)="cancel()"
        ></app-button>
        <app-button
          [label]="isCreating() ? 'Creating...' : 'Create'"
          variant="primary"
          [disabled]="roomForm.invalid || isCreating()"
          (clicked)="createRoom()"
        ></app-button>
      </div>
    </form>
  </div>
</div>
