<div class="login-container">
  <form (ngSubmit)="login()">
    <h2>Iniciar Sesión</h2>

    <div>
      <label for="email">Correo Electrónico</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="Introduce tu correo electrónico"
      />
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Introduce tu contraseña"
      />
    </div>

    @if (errorMessage) {
      <div class="error">
        {{ errorMessage }}
      </div>
    }

    <button type="submit" [disabled]="!email || !password">Iniciar Sesión</button>
    <div class="register-link">
      No tienes una cuenta? <a routerLink="/register">Registrate aquí</a>
    </div>
  </form>
</div>
